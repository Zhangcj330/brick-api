<!doctype html>
<html><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px 32px; background:var(--white); height:180px; box-sizing:border-box; }
  .lbl { font-size:11px; color:var(--fg-secondary); letter-spacing:0.08em; text-transform:uppercase; font-weight:600; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(10, 1fr); gap:16px; }
  .ic { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .ic svg { width:24px; height:24px; }
  .ic span { font-size:10px; color:var(--fg-secondary); }
  .meta { margin-top:18px; font-size:12px; color:var(--fg-secondary); }
  .meta b { color:var(--fg); font-weight:600; }
</style></head>
<body>
  <div class="lbl">Iconography · 24px grid · 2px stroke · rounded caps · outline default</div>
  <div class="grid">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-7 8-13a8 8 0 1 0-16 0c0 6 8 13 8 13Z"/><circle cx="12" cy="9" r="3"/></svg><span>pin</span></div>
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M5 13l1.5-5h11L19 13M5 17v3M19 17v3"/><circle cx="8" cy="17" r="1.5" fill="#000"/><circle cx="16" cy="17" r="1.5" fill="#000"/></svg><span>car</span></div>
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span>clock</span></div>
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 12 3l9 9M5 10v10h14V10"/></svg><span>home</span></div>
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span>search</span></div>
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg><span>user</span></div>
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6l-8-4Z"/></svg><span>shield</span></div>
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15 9 22 9 17 14 19 21 12 17 5 21 7 14 2 9 9 9 12 2"/></svg><span>star</span></div>
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 11h20"/></svg><span>card</span></div>
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg><span>menu</span></div>
  </div>
  <div class="meta"><b>Substitute:</b> Lucide CDN · matches Uber's 24/2px/rounded outline style. Filled variants use <code>fill="currentColor"</code>.</div>
</body></html>
