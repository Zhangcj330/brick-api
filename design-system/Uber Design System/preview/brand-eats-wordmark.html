<!doctype html>
<html><head><meta charset="utf-8"><title>Eats wordmark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:32px 40px; background:var(--white); display:flex; align-items:center; gap:40px; height:150px; box-sizing:border-box; }
  .wm { font-family: var(--font-display); font-weight:900; font-size:64px; letter-spacing:-0.04em; line-height:1; }
  .wm .green { color:#06C167; }
  .meta { font-size:13px; color:var(--fg-secondary); line-height:1.6; max-width:240px; }
  .meta b { color:var(--fg); font-weight:600; display:block; font-size:14px; margin-bottom:4px; }
</style></head>
<body>
  <div class="wm">Uber <span class="green">Eats</span></div>
  <div class="meta">
    <b>Sub-brand : Uber Eats</b>
    "Uber" stays black; "Eats" picks up brand green. Same weight, same tracking.
  </div>
</body></html>
