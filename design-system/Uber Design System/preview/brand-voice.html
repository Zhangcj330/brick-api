<!doctype html>
<html><head><meta charset="utf-8"><title>Voice</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px 36px; background:var(--white); box-sizing:border-box; }
  .lbl { font-size:11px; color:var(--fg-secondary); letter-spacing:0.08em; text-transform:uppercase; font-weight:600; margin-bottom:18px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:24px 32px; }
  .col { }
  .row { display:flex; gap:12px; align-items:flex-start; margin-bottom:10px; }
  .mark { font-family:var(--font-display); font-weight:700; font-size:14px; width:14px; flex-shrink:0; line-height:1.45; }
  .yes { color:#06C167; }
  .no  { color:#E11900; text-decoration:line-through; text-decoration-color:#E11900; }
  .ex { font-family:var(--font-display); font-size:15px; font-weight:600; letter-spacing:-0.005em; }
  .colhead { font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:12px; }
  .yes-head { color:#06C167; }
  .no-head { color:#E11900; }
</style></head>
<body>
  <div class="lbl">Voice · direct, plainspoken, action-first</div>
  <div class="grid">
    <div class="col">
      <div class="colhead yes-head">Do</div>
      <div class="row"><span class="mark yes">✓</span><span class="ex">Request a ride in minutes.</span></div>
      <div class="row"><span class="mark yes">✓</span><span class="ex">$12.40 · 8 min away</span></div>
      <div class="row"><span class="mark yes">✓</span><span class="ex">Drive on your schedule.</span></div>
      <div class="row"><span class="mark yes">✓</span><span class="ex">Couldn't find a driver nearby.</span></div>
    </div>
    <div class="col">
      <div class="colhead no-head">Don't</div>
      <div class="row"><span class="mark no">✗</span><span class="ex" style="color:var(--fg-secondary)">Discover your perfect ride! 🚗</span></div>
      <div class="row"><span class="mark no">✗</span><span class="ex" style="color:var(--fg-secondary)">Affordable, fast, and friendly.</span></div>
      <div class="row"><span class="mark no">✗</span><span class="ex" style="color:var(--fg-secondary)">Be your own boss — hustle on!</span></div>
      <div class="row"><span class="mark no">✗</span><span class="ex" style="color:var(--fg-secondary)">Oops! Something went wrong 😕</span></div>
    </div>
  </div>
</body></html>
