<!doctype html>
<html><head><meta charset="utf-8"><title>Numeric / tabular</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px 40px; background:var(--white); display:flex; gap:36px; align-items:center; height:150px; box-sizing:border-box; }
  .col { display:flex; flex-direction:column; gap:4px; }
  .num { font-family:var(--font-display); font-feature-settings:"tnum" 1; font-weight:700; font-size:36px; letter-spacing:-0.02em; line-height:1; }
  .lbl { font-size:11px; color:var(--fg-secondary); letter-spacing:0.08em; text-transform:uppercase; }
  .pair { display:flex; gap:6px; align-items:baseline; font-size:15px; color:var(--fg-secondary); }
  .pair b { color:var(--fg); font-weight:600; }
  .meta { font-size:12px; color:var(--fg-secondary); max-width:200px; line-height:1.5; margin-left:auto; }
</style></head>
<body>
  <div class="col">
    <div class="num">$12.40</div>
    <div class="lbl">Fare</div>
  </div>
  <div class="col">
    <div class="num">8 min</div>
    <div class="lbl">ETA</div>
  </div>
  <div class="col">
    <div class="num">4.92</div>
    <div class="lbl">Rating</div>
  </div>
  <div class="meta">All numbers tabular (<code style="font-size:11px">font-feature-settings: "tnum"</code>) so they don't jitter on update.</div>
</body></html>
