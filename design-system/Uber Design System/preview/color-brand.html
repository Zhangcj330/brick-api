<!doctype html>
<html><head><meta charset="utf-8"><title>Brand colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px 40px; background:var(--white); display:flex; gap:14px; align-items:center; height:150px; box-sizing:border-box; }
  .swatch { width:170px; height:110px; border-radius:8px; padding:14px 16px; display:flex; flex-direction:column; justify-content:space-between; font-family:var(--font-mono); font-size:11px; }
  .swatch b { font-family:var(--font-display); font-size:14px; font-weight:700; letter-spacing:-0.01em; }
  .black { background:#000; color:#fff; }
  .white { background:#fff; color:#000; border:1px solid var(--border); }
  .eats  { background:#06C167; color:#000; }
</style></head>
<body>
  <div class="swatch black"><b>Black</b>#000000</div>
  <div class="swatch white"><b>White</b>#FFFFFF</div>
  <div class="swatch eats"><b>Eats Green</b>#06C167</div>
</body></html>
