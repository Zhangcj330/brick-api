<!doctype html>
<html><head><meta charset="utf-8"><title>Cards</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:var(--grey-50); height:280px; box-sizing:border-box; display:flex; gap:16px; align-items:stretch; }
  .card { background:#fff; border-radius:12px; padding:18px; flex:1; display:flex; flex-direction:column; gap:8px; box-shadow:0 1px 2px rgba(0,0,0,0.06); }
  .card.bordered { box-shadow:none; border:1px solid var(--border); }
  .card.dark { background:#000; color:#fff; }
  .eyebrow { font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--fg-secondary); }
  .card.dark .eyebrow { color:#AFAFAF; }
  .title { font-family:var(--font-display); font-weight:700; font-size:22px; letter-spacing:-0.02em; line-height:1.1; }
  .body { font-size:13px; line-height:1.5; color:var(--fg-secondary); }
  .card.dark .body { color:#CBCBCB; }
  .cta { font-family:var(--font-display); font-weight:600; font-size:13px; display:inline-flex; align-items:center; gap:4px; margin-top:auto; }
</style></head>
<body>
  <div class="card">
    <div class="eyebrow">Promotion</div>
    <div class="title">10% off your next 5 rides</div>
    <div class="body">Auto-applied to UberX, Comfort and Black trips through May 31.</div>
    <div class="cta">Apply →</div>
  </div>
  <div class="card bordered">
    <div class="eyebrow">Saved place</div>
    <div class="title">Home</div>
    <div class="body">500 Howard St, San Francisco — 4 min from current location.</div>
    <div class="cta">Set as pickup →</div>
  </div>
  <div class="card dark">
    <div class="eyebrow">Uber One</div>
    <div class="title">Member benefits, every ride</div>
    <div class="body">5% off Uber rides. $0 delivery fees on Eats.</div>
    <div class="cta">Try free →</div>
  </div>
</body></html>
