<!doctype html>
<html><head><meta charset="utf-8"><title>Type scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px 40px; background:var(--white); box-sizing:border-box; }
  .row { display:flex; align-items:baseline; gap:16px; padding:7px 0; border-bottom:1px solid var(--divider); }
  .row:last-child { border:0; }
  .size { font-family:var(--font-mono); font-size:11px; color:var(--fg-secondary); width:72px; flex-shrink:0; letter-spacing:0; }
  .sample { font-family:var(--font-display); font-weight:700; color:#000; letter-spacing:-0.02em; line-height:1.1; }
</style></head>
<body>
  <div class="row"><div class="size">56 / Bold</div><div class="sample" style="font-size:40px">Go anywhere</div></div>
  <div class="row"><div class="size">32 / Bold</div><div class="sample" style="font-size:28px">Request a ride</div></div>
  <div class="row"><div class="size">24 / Bold</div><div class="sample" style="font-size:22px">Where to?</div></div>
  <div class="row"><div class="size">20 / Med</div><div class="sample" style="font-size:18px;font-weight:500;letter-spacing:0;">Schedule a trip</div></div>
  <div class="row"><div class="size">16 / Reg</div><div class="sample" style="font-size:15px;font-weight:400;letter-spacing:0;">UberX · $12.40 · 8 min away</div></div>
  <div class="row"><div class="size">14 / Reg</div><div class="sample" style="font-size:13px;font-weight:400;letter-spacing:0;color:var(--fg-secondary)">Driver arrives at 4:12 PM</div></div>
</body></html>
