<!doctype html>
<html><head><meta charset="utf-8"><title>Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px 32px; background:var(--white); height:150px; box-sizing:border-box; display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; gap:6px; }
  .sw { flex:1; height:50px; border-radius:6px; display:flex; flex-direction:column; justify-content:space-between; padding:6px 8px; font-family:var(--font-mono); font-size:10px; }
  .sw b { font-family:var(--font-display); font-weight:600; font-size:11px; letter-spacing:0; }
  .lbl { font-size:11px; color:var(--fg-secondary); letter-spacing:0.08em; text-transform:uppercase; font-weight:600; }
</style></head>
<body>
  <div class="lbl">True-grey ramp · no warm or cool tint</div>
  <div class="row">
    <div class="sw" style="background:#F6F6F6;color:#000"><b>50</b>F6F6F6</div>
    <div class="sw" style="background:#EEEEEE;color:#000"><b>100</b>EEEEEE</div>
    <div class="sw" style="background:#E2E2E2;color:#000"><b>200</b>E2E2E2</div>
    <div class="sw" style="background:#CBCBCB;color:#000"><b>300</b>CBCBCB</div>
    <div class="sw" style="background:#AFAFAF;color:#000"><b>400</b>AFAFAF</div>
    <div class="sw" style="background:#757575;color:#fff"><b>500</b>757575</div>
    <div class="sw" style="background:#545454;color:#fff"><b>600</b>545454</div>
    <div class="sw" style="background:#2E2E2E;color:#fff"><b>700</b>2E2E2E</div>
    <div class="sw" style="background:#1F1F1F;color:#fff"><b>800</b>1F1F1F</div>
    <div class="sw" style="background:#141414;color:#fff"><b>900</b>141414</div>
  </div>
</body></html>
