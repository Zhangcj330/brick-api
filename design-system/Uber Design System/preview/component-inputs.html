<!doctype html>
<html><head><meta charset="utf-8"><title>Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px 32px; background:var(--white); height:200px; box-sizing:border-box; display:flex; flex-direction:column; gap:12px; }
  .lbl { font-size:11px; color:var(--fg-secondary); letter-spacing:0.08em; text-transform:uppercase; font-weight:600; }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field-label { font-size:12px; color:var(--fg-secondary); }
  .input { font-family:var(--font-body); font-size:15px; padding:14px 16px; border:1px solid #E2E2E2; border-radius:8px; background:#fff; outline:none; }
  .input:focus { border-color:#000; box-shadow: 0 0 0 1px #000; }
  .input.filled { background:#F6F6F6; border-color:transparent; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .with-icon { position:relative; }
  .with-icon svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); }
  .with-icon .input { padding-left:42px; }
</style></head>
<body>
  <div class="lbl">Inputs · 8px radius · 1px border, 2px focus</div>
  <div class="row">
    <div class="field with-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 11h18"/></svg>
      <input class="input" placeholder="Where to?">
    </div>
    <div class="field">
      <input class="input filled" placeholder="Search">
    </div>
  </div>
  <div class="row">
    <div class="field">
      <span class="field-label">Pickup</span>
      <input class="input" value="500 Howard St">
    </div>
    <div class="field">
      <span class="field-label">Promo code</span>
      <input class="input" value="WELCOME10" style="border-color:#000">
    </div>
  </div>
</body></html>
