<!doctype html>
<html><head><meta charset="utf-8"><title>List rows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:8px 0; background:var(--white); height:230px; box-sizing:border-box; }
  .row { display:flex; align-items:center; gap:14px; padding:14px 24px; border-bottom:1px solid var(--divider); cursor:pointer; }
  .row:hover { background:#F6F6F6; }
  .icon { width:40px; height:40px; border-radius:8px; background:#F6F6F6; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .meta { flex:1; min-width:0; }
  .t { font-family:var(--font-display); font-size:15px; font-weight:600; letter-spacing:-0.005em; }
  .s { font-size:13px; color:var(--fg-secondary); margin-top:2px; }
  .right { font-family:var(--font-display); font-feature-settings:"tnum"; font-weight:600; font-size:14px; text-align:right; }
  .chev { color:#AFAFAF; }
</style></head>
<body>
  <div class="row">
    <div class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-7 8-13a8 8 0 1 0-16 0c0 6 8 13 8 13Z"/><circle cx="12" cy="9" r="3"/></svg></div>
    <div class="meta"><div class="t">Home</div><div class="s">500 Howard St, San Francisco</div></div>
    <div class="chev">›</div>
  </div>
  <div class="row">
    <div class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
    <div class="meta"><div class="t">SFO Airport · Terminal 2</div><div class="s">Recent · last used 3 days ago</div></div>
    <div class="right">$48.20</div>
  </div>
  <div class="row">
    <div class="icon" style="background:#E6F8EF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#06C167" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg></div>
    <div class="meta"><div class="t">Trip complete</div><div class="s">UberX · 4.92 ★ · 14 min</div></div>
    <div class="right">$12.40</div>
  </div>
</body></html>
