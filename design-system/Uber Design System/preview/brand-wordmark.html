<!doctype html>
<html><head><meta charset="utf-8"><title>Wordmark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:32px 40px; background:var(--white); display:flex; align-items:center; gap:48px; height:150px; box-sizing:border-box; }
  .wm { font-family: var(--font-display); font-weight:900; font-size:88px; letter-spacing:-0.05em; color:#000; line-height:1; }
  .meta { font-size:13px; color:var(--fg-secondary); line-height:1.6; }
  .meta b { color:var(--fg); font-weight:600; display:block; font-size:14px; margin-bottom:4px; }
</style></head>
<body>
  <div class="wm">Uber</div>
  <div class="meta">
    <b>Primary wordmark</b>
    Hanken Grotesk Black, −0.05em tracking<br>
    Substitute for Uber Move. Always black on white, never tinted.
  </div>
</body></html>
