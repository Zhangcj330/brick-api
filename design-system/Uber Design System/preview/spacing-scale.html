<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px 32px; background:var(--white); height:200px; box-sizing:border-box; }
  .lbl { font-size:11px; color:var(--fg-secondary); letter-spacing:0.08em; text-transform:uppercase; font-weight:600; margin-bottom:14px; }
  .row { display:flex; align-items:flex-end; gap:16px; }
  .step { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .blk { background:#000; }
  .n { font-family:var(--font-mono); font-size:11px; color:var(--fg-secondary); }
  .px { font-family:var(--font-display); font-weight:600; font-size:12px; color:var(--fg); }
</style></head>
<body>
  <div class="lbl">Spacing scale · 4px base unit</div>
  <div class="row">
    <div class="step"><div class="blk" style="width:4px;height:4px"></div><div class="px">4</div><div class="n">1</div></div>
    <div class="step"><div class="blk" style="width:8px;height:8px"></div><div class="px">8</div><div class="n">2</div></div>
    <div class="step"><div class="blk" style="width:12px;height:12px"></div><div class="px">12</div><div class="n">3</div></div>
    <div class="step"><div class="blk" style="width:16px;height:16px"></div><div class="px">16</div><div class="n">4</div></div>
    <div class="step"><div class="blk" style="width:20px;height:20px"></div><div class="px">20</div><div class="n">5</div></div>
    <div class="step"><div class="blk" style="width:24px;height:24px"></div><div class="px">24</div><div class="n">6</div></div>
    <div class="step"><div class="blk" style="width:32px;height:32px"></div><div class="px">32</div><div class="n">8</div></div>
    <div class="step"><div class="blk" style="width:40px;height:40px"></div><div class="px">40</div><div class="n">10</div></div>
    <div class="step"><div class="blk" style="width:48px;height:48px"></div><div class="px">48</div><div class="n">12</div></div>
    <div class="step"><div class="blk" style="width:64px;height:64px"></div><div class="px">64</div><div class="n">16</div></div>
    <div class="step"><div class="blk" style="width:80px;height:80px"></div><div class="px">80</div><div class="n">20</div></div>
  </div>
</body></html>
