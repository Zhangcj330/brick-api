<!doctype html>
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px 32px; background:var(--white); height:170px; box-sizing:border-box; }
  .lbl { font-size:11px; color:var(--fg-secondary); letter-spacing:0.08em; text-transform:uppercase; font-weight:600; margin-bottom:14px; }
  .row { display:flex; gap:20px; align-items:flex-end; }
  .step { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .box { width:72px; height:72px; background:#F6F6F6; border:1px solid var(--border); }
  .px { font-family:var(--font-display); font-weight:600; font-size:13px; }
  .name { font-family:var(--font-mono); font-size:10px; color:var(--fg-secondary); }
</style></head>
<body>
  <div class="lbl">Corner radii</div>
  <div class="row">
    <div class="step"><div class="box" style="border-radius:0"></div><div class="px">0</div><div class="name">--radius-none</div></div>
    <div class="step"><div class="box" style="border-radius:4px"></div><div class="px">4</div><div class="name">--radius-sm</div></div>
    <div class="step"><div class="box" style="border-radius:8px"></div><div class="px">8</div><div class="name">--radius-md</div></div>
    <div class="step"><div class="box" style="border-radius:12px"></div><div class="px">12</div><div class="name">--radius-lg</div></div>
    <div class="step"><div class="box" style="border-radius:24px"></div><div class="px">24</div><div class="name">--radius-xl</div></div>
    <div class="step"><div class="box" style="border-radius:999px;width:120px"></div><div class="px">pill</div><div class="name">--radius-pill</div></div>
  </div>
</body></html>
