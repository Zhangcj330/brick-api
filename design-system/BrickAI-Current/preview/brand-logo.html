<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Brick AI · Brand logo</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    * { box-sizing:border-box; }
    body { margin:0; padding:24px 32px; background:var(--page-bg); font-family:var(--font-body); }
    .lbl { font-size:11px; letter-spacing:var(--tracking-caps); text-transform:uppercase; font-weight:var(--weight-medium); color:var(--muted); margin-bottom:16px; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .tile { min-height:156px; border-radius:var(--radius-card); padding:24px; display:flex; flex-direction:column; justify-content:space-between; border:1px solid var(--line); background:var(--surface); }
    .tile.dark { background:var(--brand); border-color:rgba(255,255,255,0.1); }
    .brand { display:flex; align-items:center; gap:14px; }
    .logo-img { height:60px; width:auto; object-fit:contain; }
    .logo-img.inv { filter:brightness(0) invert(1); }
    .meta { font-size:11px; letter-spacing:var(--tracking-caps); text-transform:uppercase; color:var(--muted); }
    .dark .meta { color:rgba(255,255,255,0.45); }
  </style>
</head>
<body>
  <div class="lbl">Brand logo · mark + wordmark</div>
  <div class="row">
    <div class="tile">
      <div class="brand">
        <img class="logo-img" src="/brickAI_logo_transparent.png" alt="Brick AI"
          onerror="this.outerHTML='<div style=\'height:52px;display:flex;align-items:center;gap:10px\'><div style=\'width:44px;height:44px;border-radius:10px;background:#160211;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px\'>B</div><div style=\'font-size:24px;font-weight:600;color:#160211;letter-spacing:-0.02em\'>Brick AI</div></div>'" />
      </div>
      <div class="meta">Light — white background</div>
    </div>
    <div class="tile dark">
      <div class="brand">
        <img class="logo-img inv" src="/brickAI_logo_transparent.png" alt="Brick AI"
          onerror="this.outerHTML='<div style=\'height:52px;display:flex;align-items:center;gap:10px\'><div style=\'width:44px;height:44px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;color:#160211;font-weight:700;font-size:18px\'>B</div><div style=\'font-size:24px;font-weight:600;color:#fff;letter-spacing:-0.02em\'>Brick AI</div></div>'" />
      </div>
      <div class="meta">Dark — brand #160211</div>
    </div>
  </div>
</body>
</html>
