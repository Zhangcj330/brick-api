<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Brick AI · Landing Gradients</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    * { box-sizing:border-box; }
    body { margin:0; padding:20px 24px; background:var(--bg); font-family:var(--font-body); }
    .lbl { font-size:11px; letter-spacing:var(--tracking-label); text-transform:uppercase; font-weight:var(--weight-medium); color:var(--gray-400); margin-bottom:14px; }
    .row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
    .swatch { border-radius:var(--radius-xl); overflow:hidden; border:1px solid rgba(0,0,0,0.06); }
    .grad { height:100px; }
    .info { padding:10px 12px; background:#fff; border-top:1px solid #f3f4f6; }
    .variant-name { font-size:12px; font-weight:var(--weight-medium); color:var(--brand); margin-bottom:4px; }
    .stops { font-family:var(--font-mono); font-size:10px; color:var(--gray-400); line-height:1.6; }
    .usage { font-size:11px; color:var(--gray-500); margin-top:4px; }
  </style>
</head>
<body>
  <div class="lbl">Landing Variants · Aurora / Dusk / Coastal</div>
  <div class="row">
    <div class="swatch">
      <div class="grad" style="background:linear-gradient(to bottom, var(--aurora-from), var(--aurora-mid), var(--aurora-to))"></div>
      <div class="info">
        <div class="variant-name">Aurora</div>
        <div class="stops">blue-50 → white → emerald-50<br>#eff6ff · #fff · #ecfdf5</div>
        <div class="usage">Default variant (A/B random)</div>
      </div>
    </div>
    <div class="swatch">
      <div class="grad" style="background:linear-gradient(to bottom, var(--dusk-from), var(--dusk-mid), var(--dusk-to))"></div>
      <div class="info">
        <div class="variant-name">Dusk</div>
        <div class="stops">orange-50 → white → amber-50<br>#fff7ed · #fff · #fffbeb</div>
        <div class="usage">Investor mode label</div>
      </div>
    </div>
    <div class="swatch">
      <div class="grad" style="background:linear-gradient(to bottom, var(--coastal-from), var(--coastal-mid), var(--coastal-to))"></div>
      <div class="info">
        <div class="variant-name">Coastal</div>
        <div class="stops">cyan-50 → white → blue-50<br>#ecfeff · #fff · #eff6ff</div>
        <div class="usage">Coastal lifestyle label</div>
      </div>
    </div>
  </div>
</body>
</html>
