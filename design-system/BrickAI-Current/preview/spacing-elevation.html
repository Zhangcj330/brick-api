<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Brick AI · Elevation</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    * { box-sizing:border-box; }
    body { margin:0; padding:24px 32px; background:var(--page-bg); font-family:var(--font-body); }
    .lbl { font-size:11px; letter-spacing:var(--tracking-caps); text-transform:uppercase; font-weight:var(--weight-medium); color:var(--muted); margin-bottom:16px; }
    .stage { background:var(--soft); border-radius:var(--radius-xl); padding:24px; }
    .row { display:flex; gap:16px; flex-wrap:wrap; }
    .item { display:flex; flex-direction:column; gap:8px; }
    .card { width:110px; height:72px; background:#fff; border-radius:var(--radius-lg); border:1px solid rgba(0,0,0,0.04); }
    .name { font-family:var(--font-mono); font-size:10px; color:var(--muted); }
    .desc { font-size:10px; color:var(--muted); }
  </style>
</head>
<body>
  <div class="lbl">Elevation · directional, far-reaching shadows</div>
  <div class="stage">
    <div class="row">
      <div class="item">
        <div class="card"></div>
        <div class="name">none</div>
        <div class="desc">flat</div>
      </div>
      <div class="item">
        <div class="card" style="box-shadow:var(--shadow-card)"></div>
        <div class="name">shadow-card</div>
        <div class="desc">PropertyCard hover</div>
      </div>
      <div class="item">
        <div class="card" style="box-shadow:var(--shadow-chat-ai)"></div>
        <div class="name">shadow-chat-ai</div>
        <div class="desc">AI message bubble</div>
      </div>
      <div class="item">
        <div class="card" style="box-shadow:var(--shadow-nav)"></div>
        <div class="name">shadow-nav</div>
        <div class="desc">Nav pill, sign-in btn</div>
      </div>
      <div class="item">
        <div class="card" style="box-shadow:var(--shadow-report)"></div>
        <div class="name">shadow-report</div>
        <div class="desc">Report hero card</div>
      </div>
      <div class="item">
        <div class="card" style="box-shadow:var(--shadow-swipe)"></div>
        <div class="name">shadow-swipe</div>
        <div class="desc">Swipe stack card</div>
      </div>
    </div>
  </div>
</body>
</html>
