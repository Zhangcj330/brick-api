<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Brick AI · Motion</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    * { box-sizing:border-box; }
    body { margin:0; padding:24px 32px; background:var(--bg); font-family:var(--font-body); }
    .lbl { font-size:11px; letter-spacing:var(--tracking-label); text-transform:uppercase; font-weight:var(--weight-medium); color:var(--gray-400); margin-bottom:16px; }
    .grid { display:grid; grid-template-columns:1.2fr 0.8fr; gap:16px; }
    .panel { border:1px solid var(--border); border-radius:var(--radius-xl); padding:16px 18px; background:var(--gray-50); }
    .step { display:grid; grid-template-columns:62px 52px 1fr; align-items:center; gap:12px; margin-bottom:12px; }
    .step:last-child { margin-bottom:0; }
    .name { font-size:11px; text-transform:uppercase; letter-spacing:var(--tracking-wide); color:var(--gray-500); }
    .time { font-family:var(--font-mono); font-size:12px; color:var(--fg); }
    .bar  { height:6px; border-radius:var(--radius-full); background:var(--brand); }
    .note { font-size:11px; color:var(--gray-400); margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
    .curve-wrap { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .curve-card { padding:12px; background:var(--white); border:1px solid var(--border); border-radius:var(--radius-lg); }
    .curve-label { margin-bottom:6px; font-size:11px; color:var(--gray-500); }
    .curve-card svg { display:block; width:100%; height:44px; }
    .curve-code { font-family:var(--font-mono); font-size:10px; color:var(--fg); margin-top:4px; }
  </style>
</head>
<body>
  <div class="lbl">Motion · keyboard float (15–20s), UI transitions 150–300ms</div>
  <div class="grid">
    <div class="panel">
      <div class="step"><div class="name">micro</div><div class="time">100ms</div><div class="bar" style="width:18%"></div></div>
      <div class="step"><div class="name">short</div><div class="time">150ms</div><div class="bar" style="width:27%"></div></div>
      <div class="step"><div class="name">medium</div><div class="time">300ms</div><div class="bar" style="width:55%"></div></div>
      <div class="step"><div class="name">float</div><div class="time">15–20s</div><div class="bar" style="width:100%"></div></div>
      <div class="note">Keyboard icon decorations animate on infinite float loops (y, x, rotate)</div>
    </div>
    <div class="curve-wrap">
      <div class="curve-card">
        <div class="curve-label">ease-out</div>
        <svg viewBox="0 0 100 44" aria-hidden="true">
          <path d="M8 38 C28 38 36 8 92 4" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <div class="curve-code">0.25, 0, 0, 1</div>
      </div>
      <div class="curve-card">
        <div class="curve-label">ease-in-out</div>
        <svg viewBox="0 0 100 44" aria-hidden="true">
          <path d="M8 38 C28 38 28 4 50 4 S76 38 92 4" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <div class="curve-code">0.45, 0, 0.55, 1</div>
      </div>
    </div>
  </div>
</body>
</html>
