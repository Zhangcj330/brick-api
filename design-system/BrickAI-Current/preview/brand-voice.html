<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Brick AI · Brand voice</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    * { box-sizing:border-box; }
    body { margin:0; padding:24px 32px; background:var(--page-bg); font-family:var(--font-body); }
    .lbl { font-size:11px; letter-spacing:var(--tracking-caps); text-transform:uppercase; font-weight:var(--weight-medium); color:var(--muted); margin-bottom:18px; }
    .grid { display:grid; grid-template-columns:1.2fr 0.9fr; gap:16px; }
    .panel { border:1px solid var(--line); border-radius:var(--radius-xl); background:var(--soft); padding:18px; }
    .principle { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
    .principle:last-child { border-bottom:0; padding-bottom:0; }
    .title { font-size:17px; font-weight:var(--weight-medium); color:var(--ink); }
    .detail { font-size:12px; color:var(--muted); }
    .stack { display:flex; flex-direction:column; gap:8px; }
    .chip { padding:8px 14px; border-radius:var(--radius-full); font-size:13px; font-weight:var(--weight-medium); border:1px solid; }
    .good    { background:var(--verdict-positive-bg); border-color:var(--verdict-positive-border); color:var(--verdict-positive-fg); }
    .careful { background:var(--verdict-cautious-bg); border-color:var(--verdict-cautious-border); color:var(--verdict-cautious-fg); }
    .unknown { background:var(--soft); border-color:var(--line); color:var(--muted); }
  </style>
</head>
<body>
  <div class="lbl">Brand voice · helpful, direct, buyer-first</div>
  <div class="grid">
    <div class="panel">
      <div class="principle"><div class="title">reason over specs</div><div class="detail">judgment first</div></div>
      <div class="principle"><div class="title">context over listing copy</div><div class="detail">reality over marketing</div></div>
      <div class="principle"><div class="title">decision over score</div><div class="detail">why matters most</div></div>
    </div>
    <div class="panel stack">
      <div class="chip good">Worth pursuing</div>
      <div class="chip careful">Proceed with caution</div>
      <div class="chip unknown">Too many unknowns</div>
    </div>
  </div>
</body>
</html>
