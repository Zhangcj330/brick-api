<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Brick AI · Chat</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    * { box-sizing:border-box; }
    body { margin:0; padding:24px 32px; background:var(--bg); font-family:var(--font-body); }
    .lbl { font-size:11px; font-family:var(--font-body); letter-spacing:0.08em; text-transform:uppercase; font-weight:500; color:var(--fg-secondary); margin-bottom:14px; }
    .panel { background:var(--limestone); border-radius:var(--radius-xl); padding:16px; }
    .thread { display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
    .bubble { max-width:78%; padding:12px 14px; border-radius:var(--radius-md); font-size:14px; line-height:1.5; }
    .user { align-self:flex-end; background:var(--ink); color:var(--paper); }
    .ai { align-self:flex-start; background:var(--paper); color:var(--fg); border:1px solid var(--border); }
    .composer { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; background:var(--paper); border:1px solid var(--chalk); border-radius:var(--radius-md); padding:8px 8px 8px 14px; }
    .placeholder { color:var(--fg-tertiary); font-size:14px; }
    .send { height:36px; padding:0 14px; border-radius:var(--radius-sm); background:var(--ink); color:var(--paper); display:inline-flex; align-items:center; font-size:13px; font-weight:500; }
  </style>
</head>
<body>
  <div class="lbl">Property chat · compact support panel</div>
  <div class="panel">
    <div class="thread">
      <div class="bubble user">What is the main reason this one still looks worth inspecting?</div>
      <div class="bubble ai">The block and layout look strong for the price bracket. The main open question is drainage near the rear wall, so inspection should focus there first.</div>
    </div>
    <div class="composer">
      <div class="placeholder">Ask about this property…</div>
      <div class="send">Send</div>
    </div>
  </div>
</body>
</html>
