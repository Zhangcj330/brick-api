<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Brick AI · Semantic colors</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    * { box-sizing:border-box; }
    body { margin:0; padding:20px 32px; background:var(--bg); font-family:var(--font-body); }
    .lbl { font-size:11px; font-family:var(--font-body); letter-spacing:0.08em; text-transform:uppercase; font-weight:500; color:var(--fg-secondary); margin-bottom:14px; }
    .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; }
    .group { border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px; background:rgba(255,255,255,0.5); }
    .pair { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .swatch { height:78px; border-radius:8px; padding:10px; display:flex; align-items:flex-end; font-family:var(--font-mono); font-size:11px; }
    .meta { margin-top:10px; display:flex; gap:10px; }
    .meta div { flex:1; font-size:12px; color:var(--fg-secondary); }
    .meta strong { display:block; color:var(--fg); font-weight:500; margin-bottom:2px; }
  </style>
</head>
<body>
  <div class="lbl">Semantic colors · meaning before decoration</div>
  <div class="grid">
    <div class="group">
      <div class="pair">
        <div class="swatch" style="background:var(--positive); color:var(--paper);">#355B4C</div>
        <div class="swatch" style="background:var(--positive-bg); color:var(--ink);">#DCE4DE</div>
      </div>
      <div class="meta"><div><strong>positive</strong>trust, forward motion</div><div><strong>positive-bg</strong>quiet support</div></div>
    </div>
    <div class="group">
      <div class="pair">
        <div class="swatch" style="background:var(--caution); color:var(--paper);">#A66A43</div>
        <div class="swatch" style="background:var(--caution-bg); color:var(--ink);">#E9DDD1</div>
      </div>
      <div class="meta"><div><strong>caution</strong>checks outstanding</div><div><strong>caution-bg</strong>warm emphasis</div></div>
    </div>
    <div class="group">
      <div class="pair">
        <div class="swatch" style="background:var(--destructive); color:var(--paper);">#B6523B</div>
        <div class="swatch" style="background:var(--destructive-bg); color:var(--ink);">#F4E4DE</div>
      </div>
      <div class="meta"><div><strong>destructive</strong>material concern</div><div><strong>destructive-bg</strong>alert framing</div></div>
    </div>
  </div>
</body>
</html>
