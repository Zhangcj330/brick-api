<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Brick AI · Color palette</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    * { box-sizing:border-box; }
    body { margin:0; padding:20px 24px; background:var(--bg); font-family:var(--font-body); }
    .lbl { font-size:11px; font-family:var(--font-body); letter-spacing:0.08em; text-transform:uppercase; font-weight:500; color:var(--fg-secondary); margin-bottom:14px; }
    .row { display:flex; gap:12px; overflow-x:auto; padding-bottom:4px; }
    .swatch { min-width:100px; }
    .chip { width:100px; height:80px; border-radius:8px; margin-bottom:8px; }
    .name { font-size:12px; color:var(--fg); margin-bottom:2px; }
    .hex { font-family:var(--font-mono); font-size:11px; color:var(--fg-secondary); }
  </style>
</head>
<body>
  <div class="lbl">Color palette · primitives</div>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#FFFDF8;border:1px solid var(--chalk)"></div><div class="name">Paper</div><div class="hex">#FFFDF8</div></div>
    <div class="swatch"><div class="chip" style="background:#F6F1E7;border:1px solid var(--chalk)"></div><div class="name">Limestone</div><div class="hex">#F6F1E7</div></div>
    <div class="swatch"><div class="chip" style="background:#ECE5D7;border:1px solid var(--chalk)"></div><div class="name">Chalk</div><div class="hex">#ECE5D7</div></div>
    <div class="swatch"><div class="chip" style="background:#171614"></div><div class="name">Ink</div><div class="hex">#171614</div></div>
    <div class="swatch"><div class="chip" style="background:#6E736B"></div><div class="name">Slate</div><div class="hex">#6E736B</div></div>
    <div class="swatch"><div class="chip" style="background:#355B4C"></div><div class="name">Eucalyptus</div><div class="hex">#355B4C</div></div>
    <div class="swatch"><div class="chip" style="background:#DCE4DE"></div><div class="name">Fog</div><div class="hex">#DCE4DE</div></div>
    <div class="swatch"><div class="chip" style="background:#A66A43"></div><div class="name">Clay</div><div class="hex">#A66A43</div></div>
    <div class="swatch"><div class="chip" style="background:#E9DDD1"></div><div class="name">Dust</div><div class="hex">#E9DDD1</div></div>
    <div class="swatch"><div class="chip" style="background:#B6523B"></div><div class="name">Signal</div><div class="hex">#B6523B</div></div>
    <div class="swatch"><div class="chip" style="background:#0E1210"></div><div class="name">Night</div><div class="hex">#0E1210</div></div>
  </div>
</body>
</html>
