<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Brick AI · Display type</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    * { box-sizing:border-box; }
    body { margin:0; padding:24px 32px; background:var(--bg); font-family:var(--font-body); }
    .lbl { font-size:11px; font-family:var(--font-body); letter-spacing:0.08em; text-transform:uppercase; font-weight:500; color:var(--fg-secondary); margin-bottom:16px; }
    .panel { background:#FFFFFF; border:1px solid var(--border); border-radius:var(--radius-xl); padding:26px 28px; }
    .hero { font-family:var(--font-serif); font-size:64px; line-height:1.02; color:var(--fg); letter-spacing:-0.03em; }
    .sub { margin-top:8px; font-family:var(--font-serif); font-style:italic; font-size:24px; line-height:1.2; color:var(--fg-secondary); }
    .cap { margin-top:16px; font-family:var(--font-mono); font-size:11px; color:var(--fg-secondary); }
  </style>
</head>
<body>
  <div class="lbl">Display type · Instrument Serif</div>
  <div class="panel">
    <div class="hero">Worth pursuing.</div>
    <div class="sub">Judgment should read with calm conviction.</div>
    <div class="cap">Instrument Serif · 64px display study</div>
  </div>
</body>
</html>
